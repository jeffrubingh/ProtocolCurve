<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="ArtifactLens coverage score composition">
  <title>ArtifactLens coverage score composition</title>
  <desc>How the provenance coverage score is composed: connectivity at weight 0.30, rootedness at 0.30, verification at 0.25, and mean transformation confidence at 0.15, combining into one weighted score that maps to a letter grade from A to F.</desc>
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4e89"/>
      <stop offset="1" stop-color="#3f7cc0"/>
    </linearGradient>
  </defs>

  <rect width="420" height="300" fill="#faf7ef"/>
  <rect x="0" y="0" width="420" height="5" fill="#c62828"/>
  <text x="24" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4e89">Coverage score composition</text>
  <text x="24" y="52" font-family="monospace" font-size="11" fill="#5a6b7d">four weighted signals, one deterministic score</text>

  <!-- signal bars, widths proportional to their fixed weights -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#26364a">
