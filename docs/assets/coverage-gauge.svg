<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="ArtifactLens coverage score composition">
  <title>ArtifactLens coverage score composition</title>
  <desc>How the provenance coverage score is composed: connectivity at weight 0.30, rootedness at 0.30, verification at 0.25, and mean transformation confidence at 0.15, combining into one weighted score that maps to a letter grade from A to F.</desc>
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4e89"/>
      <stop offset="1" stop-color="#3f7cc0"/>
    </linearGradient>
  </defs>

  <rect width="420" height="300" fill="#faf7ef"/>
  <rect x="0" y="0" width="420" height="5" fill="#c62828"/>
  <text x="24" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4e89">Coverage score composition</text>
  <text x="24" y="52" font-family="monospace" font-size="11" fill="#5a6b7d">four weighted signals, one deterministic score</text>

  <!-- signal bars, widths proportional to their fixed weights -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#26364a">
    <text x="24" y="86">connectivity</text>
    <rect x="150" y="74" width="0" height="18" rx="3" fill="url(#fill)">
      <animate attributeName="width" values="0;180" dur="0.9s" fill="freeze"/>
    </rect>
    <text x="342" y="88" font-family="monospace" font-size="11" fill="#8a6d3b" opacity="0">0.30<animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/></text>

    <text x="24" y="122">rootedness</text>
    <rect x="150" y="110" width="0" height="18" rx="3" fill="url(#fill)">
      <animate attributeName="width" values="0;180" dur="0.9s" begin="0.15s" fill="freeze"/>
    </rect>
    <text x="342" y="124" font-family="monospace" font-size="11" fill="#8a6d3b" opacity="0">0.30<animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.95s" fill="freeze"/></text>

    <text x="24" y="158">verification</text>
    <rect x="150" y="146" width="0" height="18" rx="3" fill="url(#fill)">
      <animate attributeName="width" values="0;150" dur="0.9s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="312" y="160" font-family="monospace" font-size="11" fill="#8a6d3b" opacity="0">0.25<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.1s" fill="freeze"/></text>

    <text x="24" y="194">confidence</text>
    <rect x="150" y="182" width="0" height="18" rx="3" fill="url(#fill)">
      <animate attributeName="width" values="0;90" dur="0.9s" begin="0.45s" fill="freeze"/>
    </rect>
    <text x="252" y="196" font-family="monospace" font-size="11" fill="#8a6d3b" opacity="0">0.15<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.25s" fill="freeze"/></text>
  </g>

  <line x1="150" y1="212" x2="380" y2="212" stroke="#c9c0ab" stroke-width="1"/>
  <text x="24" y="234" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d4e89">weighted score</text>

  <!-- grade band legend -->
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <rect x="150" y="248" width="46" height="26" fill="#1f7a4d"/><text x="173" y="265" fill="#ffffff">A .90</text>
    <rect x="196" y="248" width="46" height="26" fill="#4e9b52"/><text x="219" y="265" fill="#ffffff">B .75</text>
    <rect x="242" y="248" width="46" height="26" fill="#c9a227"/><text x="265" y="265" fill="#26364a">C .60</text>
    <rect x="288" y="248" width="46" height="26" fill="#d97a2b"/><text x="311" y="265" fill="#ffffff">D .40</text>
    <rect x="334" y="248" width="46" height="26" fill="#c62828"/><text x="357" y="265" fill="#ffffff">F</text>
  </g>
</svg>
