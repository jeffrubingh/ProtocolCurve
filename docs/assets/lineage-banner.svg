<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="ArtifactLens provenance lineage">
  <title>ArtifactLens provenance lineage</title>
  <desc>A provenance graph: a root prompt fans through retrieve and generate transformations into document, code, and summary artifacts. A verified node carries a content hash, an unverified node does not, and one dangling node has no producing edge.</desc>
  <defs>
    <marker id="edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d4e89"/>
    </marker>
  </defs>

  <rect width="720" height="240" fill="#faf7ef"/>
  <rect x="0" y="0" width="720" height="5" fill="#c62828"/>
  <text x="24" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4e89">ArtifactLens</text>
  <text x="132" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5a6b7d">agent output provenance</text>

  <!-- edges (transformations) -->
  <g stroke="#1d4e89" stroke-width="2" fill="none" marker-end="url(#edge)">
    <path d="M116 120 L206 84"/>
    <path d="M116 120 L206 168"/>
    <path d="M300 84 L392 84"/>
    <path d="M300 168 L392 132"/>
    <path d="M486 84 L578 108"/>
    <path d="M486 132 L578 132"/>
  </g>

  <!-- transformation labels on edges -->
  <g font-family="monospace" font-size="10" fill="#8a6d3b">
    <text x="150" y="92">retrieve</text>
    <text x="150" y="160">generate</text>
    <text x="330" y="76">summarize</text>
    <text x="330" y="162">refactor</text>
  </g>

  <!-- root node (red) -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
    <circle cx="90" cy="120" r="26" fill="#c62828" stroke="#7a1414" stroke-width="2"/>
    <text x="90" y="118" fill="#ffffff" font-size="11">root</text>
    <text x="90" y="132" fill="#ffe0e0" font-size="9">prompt</text>

    <!-- verified document (blue fill = has content hash) -->
    <rect x="206" y="60" width="94" height="48" rx="6" fill="#1d4e89" stroke="#123a6b" stroke-width="2"/>
    <text x="253" y="82" fill="#ffffff">document</text>
    <text x="253" y="98" fill="#c9dbf0" font-size="9">hash present</text>

    <!-- unverified dataset (white fill = no hash) -->
