<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-label="Band weights from seed to sink">
  <rect width="640" height="240" fill="#0b0f14"/>
  <text x="32" y="42" fill="#e6edf3" font-family="monospace" font-size="20">band weight</text>
  <text x="32" y="66" fill="#4d5c6b" font-family="monospace" font-size="13">weighted depth over raw balance</text>
  <g font-family="monospace" font-size="14">
    <text x="32" y="108" fill="#8fa3b5">seed</text>
    <rect x="100" y="96" width="440" height="16" fill="#1b2530"/>
    <rect x="100" y="96" width="440" height="16" fill="#5ec8a0"/>
    <text x="556" y="108" fill="#5ec8a0">1.00</text>
    <text x="32" y="140" fill="#8fa3b5">core</text>
    <rect x="100" y="128" width="440" height="16" fill="#1b2530"/>
    <rect x="100" y="128" width="440" height="16" fill="#5ec8a0"/>
