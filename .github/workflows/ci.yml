name: parity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REF: f33c3c31d4eb7d3b

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: parity
        run: |
          out="$(python -m curveprotocol parity --book fixtures/book.jsonl)"
          echo "$out"
          grep -q "$REF" <<< "$out"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path impl/rust/Cargo.toml
      - name: parity
        run: |
          out="$(./impl/rust/target/release/curveprotocol fixtures/book.jsonl)"
          echo "$out"
          grep -q "$REF" <<< "$out"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: parity
        run: |
          out="$(go run ./impl/go fixtures/book.jsonl)"
          echo "$out"
          grep -q "$REF" <<< "$out"

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: g++ -O2 -std=c++20 -o /tmp/parity impl/cpp/main.cpp
      - name: parity
        run: |
          out="$(/tmp/parity fixtures/book.jsonl)"
          echo "$out"
          grep -q "$REF" <<< "$out"

  zig:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.13.0"
      - run: zig build-exe impl/zig/main.zig -O ReleaseFast -femit-bin=/tmp/parity
      - name: parity
        run: |
          out="$(/tmp/parity fixtures/book.jsonl)"
          echo "$out"
          grep -q "$REF" <<< "$out"

  haskell:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
      - run: ghc -O2 -o /tmp/parity impl/haskell/Main.hs
      - name: parity
        run: |
          out="$(/tmp/parity fixtures/book.jsonl)"
          echo "$out"
          grep -q "$REF" <<< "$out"

  ocaml:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
      - run: ocamlopt -O2 -o /tmp/parity impl/ocaml/main.ml
      - name: parity
        run: |
          out="$(/tmp/parity fixtures/book.jsonl)"
          echo "$out"
          grep -q "$REF" <<< "$out"

  typescript:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes tsx --version
      - name: parity
        run: |
          out="$(npx --yes tsx impl/typescript/main.ts fixtures/book.jsonl)"
          echo "$out"
          grep -q "$REF" <<< "$out"
