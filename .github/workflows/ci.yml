name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile package
        run: python -m compileall artifactlens
      - name: Render dossier
        run: python -m artifactlens dossier examples/fixtures/sample-graph.json
      - name: Coverage (JSON)
