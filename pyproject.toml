[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curveprotocol"
version = "1.0.0"
description = "Exponential Curve Protocol: reserve book, curve projection and depth reports."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jeff Rubingh" }]
keywords = ["curve", "liquidity", "reserves", "compounding", "usdt"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Source = "https://github.com/jeffrubingh/ArtifactLens"

[project.scripts]
curveprotocol = "curveprotocol.cli:main"

[tool.setuptools]
packages = ["curveprotocol"]
