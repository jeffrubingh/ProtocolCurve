[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artifactlens"
version = "1.0.0"
description = "Agent output provenance explorer: lineage graphs, coverage, and dossier reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ArtifactLens" }]
keywords = ["provenance", "lineage", "agents", "audit", "dossier"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Documentation = "https://example.com/artifactlens/docs"
Source = "https://example.com/artifactlens"
